openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: webhook
    description: Inbound webhook endpoints
  - name: leads
    description: Lead management
  - name: dashboard
    description: Dashboard summary data
  - name: admin
    description: Admin operations for managing branded demo clients
  - name: storage
    description: Object storage for logo uploads

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /webhook/twilio:
    post:
      operationId: twilioWebhook
      tags: [webhook]
      summary: Twilio inbound webhook
      description: >
        Receives inbound WhatsApp messages from Twilio. Validates the Twilio
        signature, deduplicates by MessageSid, upserts the lead, writes the
        message event, and enqueues a processing job. Always returns 200 quickly.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TwilioWebhookPayload"
      responses:
        "200":
          description: Acknowledged
          content:
            application/xml:
              schema:
                type: string
        "403":
          description: Invalid Twilio signature

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard summary statistics
      description: Returns aggregate counts for the lead dashboard — totals, by-status breakdown, and today's activity.
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      description: Returns paginated leads for the dashboard, scoped to a client.
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Paginated leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadsPage"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a single lead with conversation history
      description: >
        clientId is required for tenant isolation. The lead is only returned
        if it belongs to that client.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead with conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "404":
          description: Lead not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status or notes
      description: >
        clientId is required for tenant isolation. The lead is only updated
        if it belongs to that client.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Lead not found

  /admin/extract-branding:
    post:
      operationId: extractBranding
      tags: [admin]
      summary: Extract brand from a website URL
      description: >
        Fetches the given URL server-side and extracts brand signals:
        company name, primary color, logo URL, tagline. Returns suggested
        branding that the admin can review and override before creating a demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractBrandingInput"
      responses:
        "200":
          description: Extracted branding suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingConfig"
        "400":
          description: Invalid URL or failed to fetch

  /admin/clients:
    get:
      operationId: listDemoClients
      tags: [admin]
      summary: List all demo clients
      description: Returns all demo clients with their branding config.
      responses:
        "200":
          description: List of demo clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoClient"
    post:
      operationId: createDemoClient
      tags: [admin]
      summary: Create a new branded demo client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoClientInput"
      responses:
        "201":
          description: Created demo client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoClient"
        "400":
          description: Validation error or slug conflict

  /admin/clients/{id}:
    patch:
      operationId: updateDemoClient
      tags: [admin]
      summary: Update branding of a demo client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoClientUpdate"
      responses:
        "200":
          description: Updated demo client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoClient"
        "404":
          description: Client not found
    delete:
      operationId: deleteDemoClient
      tags: [admin]
      summary: Delete (soft-delete) a demo client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Client not found

  /admin/clients/{slug}/knowledge:
    get:
      operationId: listKnowledgeEntries
      tags: [admin]
      summary: List all knowledge entries for a client
      description: Returns all knowledge base entries for the client, flat list with all languages and categories.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge entries and distinct categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeListResponse"
        "404":
          description: Client not found
    post:
      operationId: createKnowledgeEntry
      tags: [admin]
      summary: Add a knowledge entry for a client
      description: Creates a new Q&A entry in the knowledge base and automatically generates its embedding.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "400":
          description: Validation error
        "404":
          description: Client not found

  /admin/clients/{slug}/knowledge/{id}:
    patch:
      operationId: updateKnowledgeEntry
      tags: [admin]
      summary: Update a knowledge entry
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeEntryBody"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeEntry"
        "404":
          description: Entry not found
    delete:
      operationId: deleteKnowledgeEntry
      tags: [admin]
      summary: Delete a knowledge entry
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Entry not found

  /clients/{slug}/content:
    get:
      operationId: getClientContent
      tags: [admin]
      summary: Get crawled knowledge content grouped by category
      description: >
        Public endpoint used by the demo frontend to load real website content
        extracted during the crawl. Returns knowledge chunks grouped by category
        (service, about, contact, faq, process). Falls back gracefully when no
        crawl has been run. Filtered by the client's primary demo language.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Content grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientContent"
        "404":
          description: Client not found

  /clients/{slug}/branding:
    get:
      operationId: getClientBranding
      tags: [admin]
      summary: Get branding config for a demo client by slug
      description: Public endpoint used by the branded demo frontend to load theme and assets.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branding config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingConfig"
        "404":
          description: Client not found

  /admin/crawl/{slug}:
    post:
      operationId: triggerCrawl
      tags: [admin]
      summary: Trigger a deep crawl for a demo client
      description: >
        Starts a background deep crawl of the client's website. Discovers all internal
        pages, extracts structured Q&A knowledge via GPT function calling, embeds
        each chunk with text-embedding-3-small, and stores results in company_knowledge.
        Returns immediately with the queued job — poll /status for progress.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Crawl job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlJobStatus"
        "400":
          description: Client has no websiteUrl configured
        "404":
          description: Client not found

  /admin/crawl/{slug}/status:
    get:
      operationId: getCrawlStatus
      tags: [admin]
      summary: Get the latest crawl job status for a demo client
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Crawl job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlJobStatus"
        "404":
          description: No crawl job found for this client

  /admin/crawl/{slug}/pages:
    get:
      operationId: getCrawlPages
      tags: [admin]
      summary: Get page-by-page crawl breakdown for a demo client
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of crawled pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrawlPageDetail"
        "404":
          description: No crawl job found

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for logo files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    TwilioWebhookPayload:
      type: object
      required: [MessageSid, From, To, Body]
      properties:
        MessageSid:
          type: string
        From:
          type: string
        To:
          type: string
        Body:
          type: string
        WaId:
          type: string
        ProfileName:
          type: string
        NumMedia:
          type: string

    Lead:
      type: object
      required: [id, clientId, phone, source, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        phone:
          type: string
        name:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        source:
          type: string
        status:
          type: string
        notes:
          type: ["string", "null"]
        conversationSummary:
          type: ["string", "null"]
        lastContactAt:
          type: ["string", "null"]
        createdAt:
          type: string

    LeadsPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ConversationMessage:
      type: object
      required: [id, clientId, leadId, direction, body, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        leadId:
          type: integer
        direction:
          type: string
        body:
          type: string
        intentDetected:
          type: ["string", "null"]
        createdAt:
          type: string

    Appointment:
      type: object
      required: [id, clientId, leadId, type, outcome, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        leadId:
          type: integer
        type:
          type: string
        preferredTime:
          type: ["string", "null"]
        confirmedAt:
          type: ["string", "null"]
        outcome:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    LeadDetail:
      type: object
      required: [lead, conversations, appointments]
      properties:
        lead:
          $ref: "#/components/schemas/Lead"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"

    DashboardStats:
      type: object
      required: [totalLeads, newLeads, qualifiedLeads, callbackBooked, escalated, needsHuman, bookedToday, newToday, contactedToday]
      properties:
        totalLeads:
          type: integer
        newLeads:
          type: integer
        qualifiedLeads:
          type: integer
        callbackBooked:
          type: integer
        escalated:
          type: integer
        needsHuman:
          type: integer
        bookedToday:
          type: integer
        newToday:
          type: integer
        contactedToday:
          type: integer

    LeadUpdate:
      type: object
      properties:
        status:
          type: string
        notes:
          type: string
        name:
          type: string

    BrandingConfig:
      type: object
      required: [companyName, slug]
      properties:
        companyName:
          type: string
        slug:
          type: string
        tagline:
          type: ["string", "null"]
        heroHeadline:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        demoLanguage:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        vertical:
          type: ["string", "null"]
        twilioSender:
          type: ["string", "null"]
        defaultMessage:
          type: ["string", "null"]

    DemoClient:
      type: object
      required: [id, name, slug, isActive, createdAt, branding]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        twilioSender:
          type: string
        branding:
          $ref: "#/components/schemas/BrandingConfig"

    DemoClientInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        branding:
          $ref: "#/components/schemas/BrandingConfig"

    DemoClientUpdate:
      type: object
      properties:
        name:
          type: string
        twilioSender:
          type: string
        branding:
          $ref: "#/components/schemas/BrandingConfig"

    ExtractBrandingInput:
      type: object
      required: [url]
      properties:
        url:
          type: string

    KnowledgeEntry:
      type: object
      required: [id, category, question, answer, language, priority, source, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
        question:
          type: string
        answer:
          type: string
        language:
          type: string
        priority:
          type: integer
        source:
          type: string
        sourceUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    CreateKnowledgeEntryBody:
      type: object
      required: [category, question, answer]
      properties:
        category:
          type: string
        question:
          type: string
        answer:
          type: string
        language:
          type: string
          default: "en"
        priority:
          type: integer
          default: 0

    UpdateKnowledgeEntryBody:
      type: object
      properties:
        category:
          type: string
        question:
          type: string
        answer:
          type: string
        language:
          type: string

    KnowledgeListResponse:
      type: object
      required: [entries, categories]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeEntry"
        categories:
          type: array
          items:
            type: string

    KnowledgeChunk:
      type: object
      required: [question, answer, confidence]
      properties:
        question:
          type: string
        answer:
          type: string
        confidence:
          type: number
        sourceUrl:
          type: ["string", "null"]

    ClientContent:
      type: object
      required: [hasCrawlData, services, about, contact, faq, process]
      properties:
        hasCrawlData:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunk"
        about:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunk"
        contact:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunk"
        faq:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunk"
        process:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeChunk"

    CrawlJobStatus:
      type: object
      required: [jobId, status, pagesFound, pagesCrawled, pagesFailed, pagesSkipped, chunksExtracted, createdAt]
      properties:
        jobId:
          type: integer
        status:
          type: string
        pagesFound:
          type: integer
        pagesCrawled:
          type: integer
        pagesFailed:
          type: integer
        pagesSkipped:
          type: integer
        chunksExtracted:
          type: integer
        errorSummary:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    CrawlPageDetail:
      type: object
      required: [id, url, status, depth, chunksExtracted]
      properties:
        id:
          type: integer
        url:
          type: string
        status:
          type: string
        depth:
          type: integer
        pageTitle:
          type: ["string", "null"]
        chunksExtracted:
          type: integer
        lastError:
          type: ["string", "null"]
        crawledAt:
          type: ["string", "null"]

    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
