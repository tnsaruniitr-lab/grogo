kind = "web"
previewPath = "/admin/"
title = "Dosteli Demo Frontend"
version = "1.0.0"
id = "artifacts/demo-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/", "/demo/" ]
localPort = 25872

[services.development]
run = "pnpm --filter @workspace/demo-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/demo-frontend", "run", "build" ]
publicDir = "artifacts/demo-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25872"
BASE_PATH = "/admin/"
